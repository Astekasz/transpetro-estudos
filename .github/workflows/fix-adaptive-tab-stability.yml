name: Fix adaptive tab stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-adaptive-tab-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App
        run: python .github/scripts/fix_adaptive_tab_stability.py
      - name: Commit fix
        run: |
          git config user.name "Astekasz"
          git config user.email "armando_rocha_@hotmail.com"
          git add src/App.jsx
          git rm .github/workflows/fix-adaptive-tab-stability.yml
          git rm .github/scripts/fix_adaptive_tab_stability.py
          git commit -m "fix: mantém questões adaptativas estáveis entre abas"
          git push
