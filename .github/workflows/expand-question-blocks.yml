name: Expand question blocks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-question-blocks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expandir blocos para 20 questões
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text()
          replacements = {
              "const [questionLimit, setQuestionLimit] = useState(10)": "const [questionLimit, setQuestionLimit] = useState(20)",
              "useEffect(() => setQuestionLimit(10), [dayFilter, themeFilter])": "useEffect(() => setQuestionLimit(20), [dayFilter, themeFilter])",
              "if (combined.length >= 10) break": "if (combined.length >= 20) break",
              "const todayQuestions = [...pool].sort((a,b) => score(b) - score(a)).slice(0,10)": "const todayQuestions = [...pool].sort((a,b) => score(b) - score(a)).slice(0,20)",
              "adaptiveSession.todayQuestions.filter(q => answers[q.id]).length * (QUESTIONS_MINUTES / 10)": "adaptiveSession.todayQuestions.filter(q => answers[q.id]).length * (QUESTIONS_MINUTES / 20)",
              "onClick={() => setQuestionLimit(v => Math.min(v+10, filteredQuestions.length))}>Mostrar mais 10 questões": "onClick={() => setQuestionLimit(v => Math.min(v+20, filteredQuestions.length))}>Mostrar mais 20 questões",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Trecho esperado não encontrado em App.jsx: {old}')
              text = text.replace(old, new, 1)
          app.write_text(text)

          balancer = Path('src/AnswerBalancer.jsx')
          text = balancer.read_text()
          replacements = {
              "for (let start = 0; start < cards.length; start += 10) {": "for (let start = 0; start < cards.length; start += 20) {",
              "balanceChunk(cards.slice(start, start + 10), Math.floor(start / 10))": "balanceChunk(cards.slice(start, start + 20), Math.floor(start / 20))",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Trecho esperado não encontrado em AnswerBalancer.jsx: {old}')
              text = text.replace(old, new, 1)
          balancer.write_text(text)
          PY
      - name: Commitar alteração
        run: |
          rm .github/workflows/expand-question-blocks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/AnswerBalancer.jsx .github/workflows/expand-question-blocks.yml
          git commit -m "feat: aumenta blocos para 20 questões"
          git push origin main
