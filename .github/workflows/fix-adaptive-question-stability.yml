name: Fix adaptive question stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-adaptive-question-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch adaptive questions
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()

          s = s.replace("import { useEffect, useMemo, useState } from 'react'", "import { useEffect, useMemo, useRef, useState } from 'react'")

          marker = "  const [simMessage, setSimMessage] = useState('')\n"
          insert = marker + "  const adaptiveQuestionsRef = useRef({ key: null, ids: [] })\n"
          if 'adaptiveQuestionsRef' not in s:
              s = s.replace(marker, insert)

          cloud_marker = "    setProgress(Object.fromEntries((p || []).map(row => [row.item_key, row.status])))"
          if "adaptiveQuestionsRef.current = { key: null, ids: [] }" not in s:
              s = s.replace(cloud_marker, "    adaptiveQuestionsRef.current = { key: null, ids: [] }\n" + cloud_marker)

          old = "    const todayQuestions = [...pool].sort((a,b) => score(b) - score(a)).slice(0,20)"
          new = """    const questionContextKey = `${todayName}|${contentQueue.map(item => item.key).join('|')}`
    let todayQuestions = []
    if (adaptiveQuestionsRef.current.key === questionContextKey && adaptiveQuestionsRef.current.ids.length) {
      todayQuestions = adaptiveQuestionsRef.current.ids.map(id => pool.find(q => q.id === id)).filter(Boolean)
    }
    if (!todayQuestions.length) {
      todayQuestions = [...pool].sort((a,b) => score(b) - score(a)).slice(0,20)
      adaptiveQuestionsRef.current = { key: questionContextKey, ids: todayQuestions.map(q => q.id) }
    }"""
          if old in s:
              s = s.replace(old, new)

          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "Astekasz"
          git config user.email "armando_rocha_@hotmail.com"
          git add src/App.jsx
          git rm .github/workflows/fix-adaptive-question-stability.yml
          git commit -m "fix: mantém bloco adaptativo estável ao responder"
          git push
